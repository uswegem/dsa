name: Test & Deploy

# Trigger: push/merge to master (the repo's actual default branch - confirmed
# via `gh repo view` / `git ls-remote`, not assumed). PRs into master run the
# test job only, via pull_request below, so a broken PR can't merge blind -
# but only a push to master itself deploys.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
        # Tests run against an in-memory SQLite DB (see tests/conftest.py) -
        # no Postgres service container needed here. Production always runs
        # on PostgreSQL; this is a testing convenience only.

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync application code
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='venv/' \
            --exclude='uploads/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.cache/' \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/dsa/
          # .cache/ (pip's cache, e.g. .cache/pip/http-v2/... - created under
          # $HOME/.cache when "Install deps..." below runs pip as `sudo -u dsa`,
          # and dsa's $HOME is /opt/dsa) is server-side runtime state, not part
          # of the deployed source - same category as venv/uploads/__pycache__
          # above. --delete was trying to remove it every run, but rsync
          # connects as DEPLOY_USER (not dsa, and not root), which doesn't own
          # those dsa:dsa-owned files - every one of those deletions failed
          # with "Permission denied", which is what actually failed this step.

      - name: Install deps, migrate, restart, health-check
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -se <<'REMOTE'
          set -euo pipefail

          # Ownership: rsync (running as the deploy user over SSH) writes
          # files as that user - hand them back to dsa before dsa-owned
          # processes (venv, systemd unit) touch them.
          sudo chown -R dsa:dsa /opt/dsa

          cd /opt/dsa
          sudo -u dsa venv/bin/pip install --quiet -r requirements.txt
          sudo -u dsa venv/bin/alembic upgrade head

          sudo systemctl restart dsa.service

          # Fail loudly if the service didn't come back up healthy, rather
          # than reporting a green deploy for a dead app.
          HEALTHY=0
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Health check passed."
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "Health check FAILED after restart - dumping recent logs:" >&2
            sudo journalctl -u dsa.service --no-pager -n 50 >&2
            exit 1
          fi

          # Deploy-time data visibility (Branches/DSAs/DTLs) - purely
          # informational, printed to the job log so a deploy's data state
          # is visible without logging into the app separately. Read-only
          # (scripts/deploy_summary.py never writes), and deliberately
          # never gates deploy success/failure: the health check above has
          # already passed, so a problem here (or a "surprising" count) is
          # for a human to sanity-check, not an automated failure.
          echo ""
          echo "=== Deploy-time data summary ==="
          sudo -u dsa venv/bin/python scripts/deploy_summary.py || echo "WARNING: could not generate deploy summary (non-fatal - deploy still succeeded)"
          REMOTE

      - name: Verify externally
        run: |
          curl -fsS https://dsa.miracore.co.tz/api/health
